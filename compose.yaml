services:
  streamlit:
    build: .
    ports:
      - "8501:8501"
    environment:
      CUSTOMER_CLAIMS_PROJECT_ROOT: /app
      RAG_RELEASE_TARGET: ${RAG_RELEASE_TARGET:-active}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in the environment before starting}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      GENERATION_TEMPERATURE: ${GENERATION_TEMPERATURE:-0.0}
      GENERATION_TIMEOUT_SECONDS: ${GENERATION_TIMEOUT_SECONDS:-60}
      GENERATION_MAX_RETRIES: ${GENERATION_MAX_RETRIES:-2}
      GENERATION_MAX_OUTPUT_TOKENS: ${GENERATION_MAX_OUTPUT_TOKENS:-1024}
      GENERATION_PROMPT_PATH: ${GENERATION_PROMPT_PATH:-prompts/grounded_answer_v1.md}
    volumes:
      - type: bind
        source: ${RAG_ACTIVE_INDEX_HOST_PATH:-./data/04_index_backup_10docs_215chunks}
        target: /app/data/04_index_backup_10docs_215chunks
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
