# CI for the repository contract: a clean checkout installs from the declared dependencies and passes
# the test suite without any credential, .env, built index, tokenizer download or application network
# access. Docs: docs/09_ci_contract.md.
#
# Two lanes, because the offline test suite cannot prove production tokenization:
#   default-suite   offline tokenizer substitute (NOT cl100k_base), Ubuntu + Windows, in a fresh
#                   virtual environment under runner.temp (isolated from the runner's own packages)
#   real-tokenizer  real cl100k_base: the committed chunk topology of the production corpus, Ubuntu
#
# Network: allowed only to install packages and, in its own step, to provision the cl100k_base
# vocabulary. During pytest, application/test Python and ordinary inherited Python subprocesses are
# DNS/socket guarded (tests/network_guard.py plus a test-only sitecustomize hook); dead proxy
# variables add a second barrier for proxy-aware tools. The runner and arbitrary native executables
# are NOT sandboxed at OS level.
#
# No secrets, no deployment, no uploads: contents are read-only, and nothing here needs
# OPENAI_API_KEY (the production embedding index is built deliberately, outside CI).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A superseded pull request run is waste; a run on main is a record and is never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  default-suite:
    name: default hermetic suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # The hosted runner's Python ships its own global packages (the Windows image's pipx needs
      # packaging>=26, this project's langchain-core needs packaging<26). Installing into it would
      # downgrade the runner's tools and make `pip check` judge them together with the project, so
      # the project gets a fresh environment of its own. This step puts the venv's interpreter first
      # on PATH for every later step, so the install, pip check, precondition and pytest commands
      # below are the same ones that run anywhere else.
      - name: "[venv] create the project environment (fresh, outside the checkout, no system site-packages)"
        shell: python
        env:
          PROJECT_VENV: ${{ runner.temp }}/project-venv
        run: |
          import os
          import venv
          from pathlib import Path

          target = Path(os.environ["PROJECT_VENV"])
          venv.EnvBuilder(system_site_packages=False, clear=True, with_pip=True).create(target)
          scripts = target / ("Scripts" if os.name == "nt" else "bin")
          if not (scripts / ("python.exe" if os.name == "nt" else "python")).exists():
              raise SystemExit(f"virtual environment {target} has no interpreter")
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as handle:
              handle.write(f"{scripts}\n")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"VIRTUAL_ENV={target}\n")
          print(f"created {target}; its interpreter is first on PATH for the remaining steps")

      - name: "[venv] verify the project environment is isolated from runner-global packages"
        shell: python
        run: |
          import importlib.metadata
          import os
          import sys
          from pathlib import Path

          prefix = Path(sys.prefix).resolve()
          temp = Path(os.environ["RUNNER_TEMP"]).resolve()
          settings = {}
          config = prefix / "pyvenv.cfg"
          if config.is_file():
              for line in config.read_text(encoding="utf-8").splitlines():
                  key, _, value = line.partition("=")
                  settings[key.strip()] = value.strip()
          installed = sorted({(dist.metadata["Name"] or "").lower() for dist in importlib.metadata.distributions()})
          # A fresh environment holds only what venv bootstraps; anything else leaked in.
          leaked = [name for name in installed if name not in ("pip", "setuptools", "wheel")]

          problems = []
          if sys.prefix == sys.base_prefix:
              problems.append(f"python is the runner's interpreter {sys.executable}, not a virtual environment")
          if not prefix.is_relative_to(temp):
              problems.append(f"environment {prefix} is not under RUNNER_TEMP {temp}")
          if Path(os.environ.get("VIRTUAL_ENV", "")).resolve() != prefix:
              problems.append(f"VIRTUAL_ENV {os.environ.get('VIRTUAL_ENV')!r} is not the interpreter's environment {prefix}")
          if settings.get("include-system-site-packages") != "false":
              problems.append("the environment can see the runner's system site-packages")
          if leaked:
              shown = ", ".join(leaked[:10]) + (f", ... ({len(leaked)} in total)" if len(leaked) > 10 else "")
              problems.append(f"packages visible before any install: {shown}")
          if problems:
              raise SystemExit("project environment is not isolated:\n  " + "\n  ".join(problems))
          print(f"isolated project environment {prefix}; visible packages: {', '.join(installed)}")

      - name: "[install] declared dependencies (.[dev])"
        run: python -m pip install -e ".[dev]"

      - name: "[install] pip check"
        run: python -m pip check

      - name: "[hermetic] precondition - no credential, .env, built index or tokenizer cache"
        shell: python
        env:
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/empty-tiktoken-cache
        run: |
          import os
          from pathlib import Path

          problems = [f"environment variable {name} is set" for name in os.environ
                      if name.startswith(("OPENAI_", "RAG_", "GENERATION_"))]
          for path in (".env", "data/04_index_production", "data/04_index/manifest.json",
                       "data/03_chunks/chunks.jsonl"):
              if Path(path).exists():
                  problems.append(f"{path} exists in a clean checkout")
          cache = Path(os.environ["TIKTOKEN_CACHE_DIR"])
          if cache.exists() and any(cache.iterdir()):
              problems.append(f"tokenizer cache {cache} is not empty")
          if problems:
              raise SystemExit("hermetic precondition violated:\n  " + "\n  ".join(problems))
          print("hermetic precondition holds: no credential, .env, built index or tokenizer cache")

      - name: "[default suite] hermetic tests (offline tokenizer substitute, not cl100k_base)"
        env:
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/empty-tiktoken-cache
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost,::1
        run: python -m pytest -p no:cacheprovider

      - name: "[hermetic] the tests left the checkout unchanged"
        shell: bash
        run: |
          changes="$(git status --porcelain)"
          if [ -n "$changes" ]; then
            echo "the test run modified or added files in the checkout:"
            echo "$changes"
            exit 1
          fi

  real-tokenizer:
    name: real cl100k_base topology (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Where the vocabulary is provisioned and where the lane reads it from.
      TIKTOKEN_CACHE_DIR: /tmp/ci-tiktoken-cache
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: "[install] declared dependencies (.[dev])"
        run: python -m pip install -e ".[dev]"

      - name: "[install] pip check"
        run: python -m pip check

      # An optimisation only. The provisioning step below always runs and tiktoken checks the
      # vocabulary's SHA-256 itself, so a stale or corrupted cache cannot satisfy the lane.
      - name: "[tokenizer cache] restore"
        uses: actions/cache@v6
        with:
          path: ${{ env.TIKTOKEN_CACHE_DIR }}
          key: tiktoken-cl100k_base-v1

      - name: "[tokenizer provisioning] fetch and verify the real cl100k_base vocabulary (network allowed here only)"
        run: python scripts/provision_tiktoken_cache.py

      - name: "[real-tokenizer lane] negative control - refuses to run without the vocabulary"
        env:
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/empty-tiktoken-cache
        run: |
          set +e
          python -m pytest --real-tiktoken -m real_tiktoken -p no:cacheprovider
          status=$?
          set -e
          if [ "$status" -ne 4 ]; then
            echo "expected pytest usage error 4 (vocabulary not provisioned), got $status"
            exit 1
          fi

      - name: "[real-tokenizer lane] production chunk topology under real cl100k_base"
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost,::1
        run: |
          # Read-only cache: the lane can read the vocabulary but nothing can write a download into it.
          chmod -R a-w "$TIKTOKEN_CACHE_DIR"
          python -m pytest --real-tiktoken -m real_tiktoken -p no:cacheprovider

      - name: "[hermetic] the tests left the checkout unchanged"
        run: |
          changes="$(git status --porcelain)"
          if [ -n "$changes" ]; then
            echo "the test run modified or added files in the checkout:"
            echo "$changes"
            exit 1
          fi
