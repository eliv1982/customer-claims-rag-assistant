[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-claims-rag"
version = "0.1.0"
description = "Staff-assist RAG triage tool for customer claims: deterministic safety rules, reproducible retrieval evaluation and hardened release validation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5,<2",
    "langchain-core>=0.3,<1",
    "langchain-openai>=0.2,<1",
    "numpy>=1.26,<3",
    "pydantic>=2.5,<3",
    "python-dotenv>=1.0,<2",
    "PyYAML>=6.0,<7",
    "tiktoken>=0.5,<1",
]

[project.optional-dependencies]
dev = [
    # tests/unit/test_serving_path_tokenizer_free.py answers the OpenAI HTTP API in-process
    "httpx>=0.27,<1",
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "streamlit>=1.40,<2",
]
ui = [
    "streamlit>=1.40,<2",
]
# One-off tooling for scripts/capture_ui_screenshots.py (acceptance evidence).
# Not needed by the app or the test suite; Chromium is installed separately:
#   python -m playwright install chromium
screenshots = [
    "playwright>=1.40,<2",
]

[project.scripts]
answer-claim = "customer_claims_rag.cli.answer_claim:main"
build-chunks = "customer_claims_rag.cli.build_chunks:main"
build-index = "customer_claims_rag.cli.build_index:main"
search-index = "customer_claims_rag.cli.search_index:main"
evaluate-retrieval = "customer_claims_rag.cli.evaluate_retrieval:main"
evaluate-reranking-ab = "customer_claims_rag.cli.evaluate_reranking_ab:main"
rebuild-reranking-ab-report = "customer_claims_rag.cli.rebuild_reranking_ab_report:main"
evaluate-pool-expansion = "customer_claims_rag.cli.evaluate_pool_expansion:main"
evaluate-expanded-corpus-regression = "customer_claims_rag.cli.evaluate_expanded_corpus_regression:main"
evaluate-vector-pool-cap-ab = "customer_claims_rag.cli.evaluate_vector_pool_cap_ab:main"
build-experiment-index = "customer_claims_rag.cli.build_experiment_index:main"
evaluate-doc08-atomic-ab = "customer_claims_rag.cli.evaluate_doc08_atomic_ab:main"
build-doc12-threat-index = "customer_claims_rag.cli.build_doc12_threat_index:main"
export-embedding-snapshot = "customer_claims_rag.cli.export_embedding_snapshot:main"
evaluate-doc12-threat-atomic-ab = "customer_claims_rag.cli.evaluate_doc12_threat_atomic_ab:main"
evaluate-hybrid-ab = "customer_claims_rag.cli.evaluate_hybrid_ab:main"
validate-release-posture = "customer_claims_rag.cli.validate_release_posture:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "real_tiktoken: production tokenization invariants that hold only under the real cl100k_base vocabulary; skipped in the default lane (offline stand-in tokenizer), run in the real-tokenizer lane: python -m pytest --real-tiktoken -m real_tiktoken (needs the vocabulary provisioned in the local tiktoken cache; never downloads, never skips)",
    "local_artifact: verifies a gitignored local artifact (production index, maintainer evaluation run); skipped with the missing path as reason when the artifact is absent, and a failure when it is present but stale or malformed",
]

[tool.coverage.run]
source = ["customer_claims_rag"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
